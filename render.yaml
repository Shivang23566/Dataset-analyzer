services:
  - type: web
    name: datalens
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build
    startCommand: cd backend && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: PRO_PLAN_AMOUNT_PAISE
        value: "21900"
      - key: PRO_PLAN_DURATION_DAYS
        value: "30"
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: NODE_VERSION
        value: "20"
